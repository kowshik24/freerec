<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreeRec Library</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { display: grid; grid-template-columns: 72px 1fr; min-height: 100vh; }
    .side { border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 0; position: sticky; top: 0; height: 100vh; }
    .side .logo { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--text); margin-bottom: 14px; }
    .side .logo span { width: 16px; height: 16px; border-radius: 50%; background: var(--danger); }
    .side a, .side button { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--text); border: 0; background: none; padding: 0; }
    .side a:hover, .side button:hover { background: var(--surface-2); }
    .side a.on { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
    .side .grow { flex: 1; }
    .side .rec { background: var(--accent); color: #fff; }
    .side .rec:hover { background: var(--accent); filter: brightness(1.1); }
    .side svg { width: 22px; height: 22px; }
    main { padding: 28px 40px 60px; min-width: 0; }
    .top { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    .kicker { color: var(--muted); font-weight: 600; }
    .title { font-size: 40px; font-weight: 800; letter-spacing: -.02em; }
    .tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--border); margin: 24px 0 18px; align-items: center; }
    .tabs button { border: 0; background: none; border-radius: 0; padding: 10px 0; color: var(--text); font-size: 16px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tabs button:hover { background: none; color: var(--accent); }
    .tabs button[aria-selected="true"] { color: var(--accent); border-color: var(--accent); }
    .tabs .count { margin-left: auto; color: var(--muted); }
    .filters { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    .filters select, .filters input { width: auto; min-width: 180px; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; transition: box-shadow .15s; }
    .item:hover { box-shadow: var(--shadow); }
    .item.new { outline: 2px solid var(--accent); }
    .thumb { aspect-ratio: 16/9; background: #111 center/cover; position: relative; }
    .thumb video, .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
    .badge { position: absolute; right: 8px; bottom: 8px; background: rgb(0 0 0 / 75%); color: #fff; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
    .meta { padding: 12px 14px 6px; }
    .meta .name { font-weight: 650; font-size: 15px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .acts { display: flex; gap: 4px; padding: 4px 8px 10px; }
    .acts button { padding: 4px 10px; font-size: 13px; border-color: transparent; color: var(--muted); }
    .acts button:hover { color: var(--text); }
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .modal { position: fixed; inset: 0; background: rgb(0 0 0 / 70%); display: grid; place-items: center; z-index: 50; padding: 24px; }
    .modal .box { background: var(--surface); border-radius: 16px; width: min(1100px, 100%); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .modal video, .modal img { width: 100%; max-height: 75vh; object-fit: contain; background: #000; border-radius: 10px; }
    @media (max-width: 700px) { body { grid-template-columns: 1fr; } .side { display: none; } main { padding: 20px 16px; } }
  </style>
</head>
<body>
  <nav class="side">
    <div class="logo" title="FreeRec"><span></span></div>
    <a href="library.html" class="on" title="Library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3.5" y="6" width="17" height="13.5" rx="2"/><path d="M7 3.5h10"/></svg></a>
    <a href="canvas.html" title="Canvas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12.5" rx="2"/><path d="M8.5 20h7M12 16.5V20"/></svg></a>
    <a href="options.html" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4 5.3 5.3"/></svg></a>
    <div class="grow"></div>
    <a href="canvas.html?panel=1" class="rec" title="New recording"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="6" width="12.5" height="12" rx="2.5"/><path d="m15.5 10.5 5-3v9l-5-3"/></svg></a>
  </nav>

  <main>
    <div class="top">
      <div class="grow">
        <div class="kicker">Library</div>
        <div class="title" id="title">Videos</div>
      </div>
      <button id="change-folder">Change folder</button>
      <a class="btn primary" href="canvas.html?panel=1" style="background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600">New video</a>
    </div>

    <div class="tabs" role="tablist">
      <button data-tab="videos" aria-selected="true">Videos</button>
      <button data-tab="screenshots" aria-selected="false">Screenshots</button>
      <span class="count" id="count"></span>
    </div>

    <div id="notice" class="banner ok" hidden></div>
    <div id="need" class="banner" hidden>
      <span id="need-text"></span>
      <div style="margin-top:8px"><button id="need-btn" class="primary"></button></div>
    </div>

    <div class="filters">
      <input type="text" id="search" placeholder="Search by name">
      <select id="sort">
        <option value="new">Newest to Oldest</option>
        <option value="old">Oldest to Newest</option>
        <option value="big">Largest first</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>

    <div id="grid"></div>
    <div id="empty" class="empty" hidden></div>

    <section id="opfs-section" class="stack" hidden style="margin-top:32px">
      <h3>Stored in browser</h3>
      <p class="muted small">Recordings that couldn't be handed to Downloads. Save them, then delete them here to free space.</p>
      <div id="opfs-grid" class="stack"></div>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="box">
      <div class="row"><strong id="modal-title" class="grow"></strong><button id="modal-close" class="ghost">Close</button></div>
      <div id="modal-body"></div>
    </div>
  </div>
  <script type="module" src="library.js"></script>
</body>
</html>
