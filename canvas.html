<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreeRec Canvas</title>
  <link rel="stylesheet" href="stage.css">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #292a2e; overflow: hidden; background: #fff; }
    #stage { position: fixed; inset: 0; }

    .toolbar {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10;
      display: flex; gap: 6px; padding: 8px; background: rgb(247 247 248 / 96%);
      border: 1px solid #d8d9dd; border-radius: 20px; box-shadow: 0 6px 24px rgb(0 0 0 / 8%);
    }
    .toolbar button { font: inherit; font-size: 17px; color: #292a2e; background: none; border: 0; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-radius: 12px; }
    .toolbar button:hover, .toolbar button[aria-expanded="true"] { background: #e8e9ec; }
    .toolbar svg { width: 24px; height: 24px; }

    .sheet {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 10;
      width: min(600px, calc(100vw - 32px)); max-height: calc(100vh - 140px); overflow: auto;
      background: #fff; border: 1px solid #e3e4e8; border-radius: 28px; padding: 36px 40px 40px;
      box-shadow: 0 16px 50px rgb(0 0 0 / 14%);
    }
    .sheet .x { position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border: 0; background: none; border-radius: 12px; cursor: pointer; display: grid; place-items: center; color: #292a2e; }
    .sheet .x:hover { background: #f1f2f4; }
    .sheet .x svg { width: 26px; height: 26px; }
    .sheet h2 { font-size: 24px; margin: 4px 0 22px; font-weight: 700; }
    .sheet h2 + .colors { margin-bottom: 36px; }
    .colors { display: flex; flex-wrap: wrap; gap: 10px; }
    .swatch { width: 48px; height: 48px; border-radius: 14px; border: 1px solid rgb(0 0 0 / 12%); cursor: pointer; padding: 0; display: grid; place-items: center; background: none; }
    .swatch.add svg { width: 24px; height: 24px; color: #292a2e; }
    .swatch[aria-pressed="true"] { outline: 3px solid #1868db; outline-offset: 3px; }
    .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .thumb { padding: 0; border: 0; background: none; cursor: pointer; border-radius: 18px; overflow: hidden; aspect-ratio: 16 / 9.4; position: relative; box-shadow: 0 0 0 1px rgb(0 0 0 / 8%); }
    .thumb .stage { pointer-events: none; }
    .thumb[aria-pressed="true"] { box-shadow: 0 0 0 3px #1868db, 0 0 0 8px #e3e9fb; }
    .thumb:hover:not([aria-pressed="true"]) { box-shadow: 0 0 0 2px #9cbcf3; }
    .layouts .thumb .stage { --bg: #f6f5f0 !important; --ink: #292a2e !important; }
    .hidden-ui .toolbar, .hidden-ui .sheet { display: none; }
    @media (max-width: 560px) { .thumbs { grid-template-columns: repeat(2, 1fr); } .sheet { padding: 28px 20px; } .toolbar button { font-size: 14px; padding: 8px 10px; gap: 6px; } }
  </style>
</head>
<body>
  <div id="stage"></div>

  <nav class="toolbar" aria-label="Canvas">
    <button data-sheet="background" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><circle cx="9" cy="9" r="1.8"/><path d="m20.5 15-5-5-11 10.5"/></svg>
      Background
    </button>
    <button data-sheet="layout" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3 5h10M8 5v14M14 11h7M17.5 11v8"/></svg>
      Text layout
    </button>
    <button data-sheet="templates" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12.5" rx="2"/><path d="M8.5 20h7M12 16.5V20"/></svg>
      Templates
    </button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <button class="x" id="sheet-close" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div id="sheet-body"></div>
  </div>
  <input type="color" id="color" hidden>

  <script src="content.js"></script>
  <script type="module" src="canvas.js"></script>
</body>
</html>
