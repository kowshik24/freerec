<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FreeRec</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 340px; }
    main { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .folder { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
    .folder svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
    .folder .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #live .time { font: 600 32px ui-monospace, monospace; text-align: center; }
    footer { display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding: 8px 10px; }
  </style>
</head>
<body>
  <main id="setup">
    <div class="brand"><span class="brand-dot"></span>FreeRec</div>

    <div class="segmented" role="group" aria-label="Recording mode">
      <button data-mode="screen-camera" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/><circle cx="17" cy="14" r="3" fill="currentColor"/></svg>
        Screen + Cam
      </button>
      <button data-mode="screen" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
        Screen only
      </button>
      <button data-mode="camera" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>
        Cam only
      </button>
    </div>

    <div id="perm" class="banner" hidden>
      Camera / microphone access not granted yet.
      <button id="grant" class="primary" style="margin-top:8px;width:100%">Allow camera &amp; microphone</button>
    </div>

    <label class="field" id="camera-field">Camera
      <select id="camera"></select>
    </label>
    <label class="field">Microphone
      <select id="mic"></select>
    </label>

    <div class="two">
      <label class="field">Quality
        <select id="quality">
          <option value="720">720p</option>
          <option value="1080">1080p</option>
          <option value="1440">1440p</option>
          <option value="2160">4K</option>
        </select>
      </label>
      <label class="field">Format
        <select id="format">
          <option value="webm">WebM (VP9)</option>
          <option value="mp4">MP4 (H.264)</option>
        </select>
      </label>
    </div>

    <div>
      <div class="small muted" style="margin-bottom:4px">Save recordings to</div>
      <div class="folder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span class="name grow" id="folder">Downloads/FreeRec</span>
        <button id="change-folder" class="ghost small">Change</button>
      </div>
    </div>

    <button id="start" class="primary big">Start recording</button>
  </main>

  <main id="live" hidden>
    <div class="row"><span class="rec-dot"></span><strong id="live-status">Recording</strong></div>
    <div class="time" id="live-time">0:00</div>
    <div class="two">
      <button id="live-pause">Pause</button>
      <button id="live-cancel">Discard</button>
    </div>
    <button id="live-stop" class="danger big">Finish &amp; save</button>
    <button id="live-open" class="ghost small">Open recorder tab</button>
  </main>

  <footer>
    <a href="library.html" target="_blank" class="small">My recordings</a>
    <a href="options.html" target="_blank" class="small">Settings</a>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
