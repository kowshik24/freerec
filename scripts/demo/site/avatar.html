<!doctype html><html><head><style>
html,body{margin:0;width:640px;height:480px;overflow:hidden}
svg{display:block}
#head{animation:sway 4s ease-in-out infinite;transform-origin:320px 330px}
#body{animation:breathe 4s ease-in-out infinite;transform-origin:320px 480px}
.eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
#mouth{animation:talk .36s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center top}
#brows{animation:brow 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(-4px)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.01,1.02)}}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.08)}}
@keyframes talk{0%{transform:scaleY(.35)}60%{transform:scaleY(1)}100%{transform:scaleY(.6)}}
@keyframes brow{0%,100%{transform:translateY(0)}30%,40%{transform:translateY(-4px)}}
</style></head><body>
