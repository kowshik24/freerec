<!doctype html><html><head><meta charset="utf-8"><title>Recording</title><style>
html,body{margin:0;height:100%;background:#202124;font-family:system-ui,-apple-system,sans-serif;color:#e8eaed;overflow:hidden}
.top{height:52px;display:flex;align-items:center;gap:12px;padding:0 20px;background:#2b2c30;border-bottom:1px solid #3c3d42;font-size:15px;font-weight:600}
.top small{color:#9aa0a6;font-weight:500;margin-left:auto;font-size:13px}
.top i{width:12px;height:12px;border-radius:3px;background:#e5484d}
.stage{position:absolute;top:52px;bottom:0;left:0;right:0;display:grid;place-items:center;padding:26px}
video{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 20px 60px rgb(0 0 0/50%);background:#000}
</style></head><body>
<div class="top"><i></i><span id="n"></span><small>Downloads/FreeRec</small></div>
<div class="stage"><video src="rec.webm" controls muted playsinline></video></div>
<script>n.textContent=new URLSearchParams(location.search).get('n')</script></body></html>
