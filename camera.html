<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FreeRec camera</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); border-radius: 50%; display: block; background: #222; }
    #msg {
      position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 18%;
      color: #ddd; background: #222; border-radius: 50%; font: 12px/1.3 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <video id="v" autoplay muted playsinline></video>
  <div id="msg"></div>
  <script src="camera.js"></script>
</body>
</html>
