<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FreeRec camera</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); border-radius: 50%; display: block; background: #1d2b4a; }
    #msg {
      position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 18%;
      color: #fff; background: #1d2b4a; border-radius: 50%; font: 600 13px/1.3 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <video id="v" autoplay muted playsinline></video>
  <canvas id="c"></canvas>
  <div id="msg"></div>
  <script type="module" src="camera.js"></script>
</body>
</html>
